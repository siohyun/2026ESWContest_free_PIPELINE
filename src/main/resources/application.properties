spring.application.name=leak-monitor-backend

# H2 (메모리 기반, 로컬 개발/데모용)
spring.datasource.url=jdbc:h2:mem:leakmonitor;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 기본값이 이미 8080 + 모든 인터페이스 바인딩이라 명시하지 않아도 됩니다.
# (에뮬레이터의 10.0.2.2 접속이 안 됐던 진짜 원인은 서버 설정이 아니라 Windows 방화벽이었습니다.)
server.port=8080

# Firebase 서비스 계정 키(JSON) 파일 경로.
# Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 > 새 비공개 키 생성으로 받은 json 파일 경로를 지정하면 됩니다.
# 비워두면 FCM 푸시는 비활성화되고(경고 로그만 남김) 나머지 API는 정상 동작합니다.
firebase.credentials-path=
